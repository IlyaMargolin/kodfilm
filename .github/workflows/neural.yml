name: Neural pass (Kaggle GPU)
# Нейропроявка: берёт neural/jobs/<job>/ (shots/*.mp4 + job.json), считает на бесплатном GPU Kaggle,
# возвращает проявленные планы артефактом «neural-<job>». Ключ — секрет KAGGLE_API_TOKEN.
on:
  workflow_dispatch:
    inputs:
      job: { description: 'Папка задания в neural/jobs', default: 'hram_test' }

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB: ${{ github.event.inputs.job || 'hram_test' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U kaggle
      - name: Who am I
        id: me
        run: |
          U=$(python3 -c "from kaggle.api.kaggle_api_extended import KaggleApi as K; a=K(); a.authenticate(); print(a.get_config_value('username'))")
          echo "Kaggle user: $U"; echo "user=$U" >> $GITHUB_OUTPUT
      - name: Upload inputs as dataset
        run: |
          U=${{ steps.me.outputs.user }}; SLUG=kodfilm-$(echo $JOB | tr '_' '-')
          mkdir -p ds && cp -r neural/jobs/$JOB/* ds/
          echo "{\"title\":\"$SLUG\",\"id\":\"$U/$SLUG\",\"licenses\":[{\"name\":\"CC0-1.0\"}]}" > ds/dataset-metadata.json
          kaggle datasets create -p ds -r zip -q || kaggle datasets version -p ds -r zip -m "update" -q --delete-old-versions
          for i in $(seq 1 30); do kaggle datasets status $U/$SLUG | tee /tmp/st; grep -qi ready /tmp/st && break; sleep 10; done
      - name: Push GPU kernel
        run: |
          U=${{ steps.me.outputs.user }}; SLUG=kodfilm-$(echo $JOB | tr '_' '-')
          mkdir -p kr && cp neural/kernel.py kr/
          cat > kr/kernel-metadata.json <<META
          {"id":"$U/$SLUG-run","title":"$SLUG-run","code_file":"kernel.py","language":"python","kernel_type":"script",
           "is_private":true,"enable_gpu":true,"enable_internet":true,"machine_shape":"NvidiaTeslaT4","dataset_sources":["$U/$SLUG"]}
          META
          kaggle kernels push -p kr
      - name: Wait for GPU run
        run: |
          U=${{ steps.me.outputs.user }}; SLUG=kodfilm-$(echo $JOB | tr '_' '-')
          for i in $(seq 1 330); do
            S=$(kaggle kernels status $U/$SLUG-run 2>&1); echo "$(date +%T) $S"
            echo "$S" | grep -qiE 'complete|error|cancel' && break; sleep 60
          done
          mkdir -p result && kaggle kernels output $U/$SLUG-run -p result || true
          ls -la result result/out 2>/dev/null || true
          tail -50 result/*.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'neural-${{ env.JOB }}', path: result/, retention-days: 14 }
