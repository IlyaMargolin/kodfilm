name: GPU farm render (Kaggle Cycles)
# Рендер фильма трассировкой путей на бесплатных GPU Kaggle (2×T4). Результат — артефакт «farm-<имя>»: frames.mp4 + meta.json.
on:
  workflow_dispatch:
    inputs:
      script:  { description: 'Сценарий', default: 'films/hram/script.txt' }
      width:   { description: 'Ширина кадра (высота = ширина / 2.39)', default: '1920' }
      samples: { description: 'Сэмплов на пиксель (с денойзом хватает 64–128)', default: '96' }
      frames:  { description: 'Кадры: пусто = все, или 1-100', default: '' }

permissions:
  contents: write

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U kaggle
      - name: Pack job
        id: me
        run: |
          U=$(python3 -c "from kaggle.api.kaggle_api_extended import KaggleApi as K; a=K(); a.authenticate(); print(a.get_config_value('username'))")
          echo "user=$U" >> $GITHUB_OUTPUT
          mkdir -p ds/assets && cp -r studio films ds/ && cp assets/fetch.sh ds/assets/
          python3 -c "import json;json.dump(dict(script='${{ github.event.inputs.script }}',w=int('${{ github.event.inputs.width }}'),samples=int('${{ github.event.inputs.samples }}'),frames='${{ github.event.inputs.frames }}'),open('ds/farm.json','w'))"
          echo "{\"title\":\"kodfilm-farm\",\"id\":\"$U/kodfilm-farm\",\"licenses\":[{\"name\":\"CC0-1.0\"}]}" > ds/dataset-metadata.json
          kaggle datasets create -p ds -r zip -q || kaggle datasets version -p ds -r zip -m "job" -q --delete-old-versions
          for i in $(seq 1 30); do kaggle datasets status $U/kodfilm-farm | tee /tmp/st; grep -qi ready /tmp/st && break; sleep 10; done
          sleep 20
      - name: Push GPU kernel
        run: |
          U=${{ steps.me.outputs.user }}
          mkdir -p kr && cp neural/farm.py kr/
          cat > kr/kernel-metadata.json <<META
          {"id":"$U/kodfilm-farm-run","title":"kodfilm-farm-run","code_file":"farm.py","language":"python","kernel_type":"script",
           "is_private":true,"enable_gpu":true,"enable_internet":true,"machine_shape":"NvidiaTeslaT4","dataset_sources":["$U/kodfilm-farm"]}
          META
          kaggle kernels push -p kr
      - name: Wait for render
        run: |
          U=${{ steps.me.outputs.user }}
          sleep 60
          for i in $(seq 1 330); do
            S=$(kaggle kernels status $U/kodfilm-farm-run 2>&1); echo "$(date +%T) $S"
            echo "$S" | grep -qiE 'complete|error|cancel' && break; sleep 60
          done
          mkdir -p result && kaggle kernels output $U/kodfilm-farm-run -p result || true
          ls -laR result | head -30; tail -60 result/*.log 2>/dev/null || true
      - name: Save result to branch
        if: always()
        run: |
          cd result && rm -f *.log && git init -q && git checkout -q -b results-farm && git add -A && \
          git -c user.name=kodfilm-bot -c user.email=bot@kodfilm commit -qm "result" && \
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git results-farm:results-farm || echo "nothing to save"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: farm-render, path: result/, retention-days: 14 }
