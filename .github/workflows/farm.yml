name: GPU farm render (Kaggle Cycles)
# Рендер фильма трассировкой путей на бесплатных GPU Kaggle (2×T4). Результат — артефакт «farm-<имя>»: frames.mp4 + meta.json.
on:
  workflow_dispatch:
    inputs:
      script:  { description: 'Сценарий', default: 'films/hram/script.txt' }
      width:   { description: 'Ширина кадра (высота = ширина / 2.39)', default: '1920' }
      samples: { description: 'Сэмплов на пиксель (с денойзом хватает 64–128)', default: '96' }
      frames:  { description: 'Кадры: пусто = все, или 1-100', default: '' }
      hero:    { description: 'Актёр главной роли (id), пусто = как в касте фильма', default: '' }
      part:    { description: 'Часть фильма (1, 2, 3…) для параллельных ноутбуков: своё имя ноутбука и ветки; кадры задать в frames', default: '' }
      account: { description: 'Аккаунт Kaggle: пусто = основной (KAGGLE_API_TOKEN), 2 = второй (KAGGLE_API_TOKEN_2)', default: '' }

permissions:
  contents: write

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ github.event.inputs.account == '2' && secrets.KAGGLE_API_TOKEN_2 || secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U kaggle
      - name: Pack job
        id: me
        run: |
          U=$(python3 -c "from kaggle.api.kaggle_api_extended import KaggleApi as K; a=K(); a.authenticate(); print(a.get_config_value('username'))")
          echo "user=$U" >> $GITHUB_OUTPUT
          mkdir -p ds/assets && cp -r studio films ds/ && cp assets/fetch.sh ds/assets/
          python3 -c "import json;json.dump(dict(script='${{ github.event.inputs.script }}',w=int('${{ github.event.inputs.width }}'),samples=int('${{ github.event.inputs.samples }}'),frames='${{ github.event.inputs.frames }}',hero='${{ github.event.inputs.hero }}'),open('ds/farm.json','w'))"
          D=kodfilm-farm-${{ github.run_number }}; echo "ds=$D" >> $GITHUB_OUTPUT
          echo "{\"title\":\"$D\",\"id\":\"$U/$D\",\"licenses\":[{\"name\":\"CC0-1.0\"}]}" > ds/dataset-metadata.json
          # свежий датасет на каждый запуск: новая версия старого датасета не успевает подхватиться ядром
          for t in 1 2 3 4; do kaggle datasets create -p ds -r zip -q && break; echo "retry $t"; sleep $((t*20)); done
          for i in $(seq 1 30); do kaggle datasets status $U/$D | tee /tmp/st; grep -qi ready /tmp/st && break; sleep 10; done
          sleep 20
      - name: Push GPU kernel
        run: |
          U=${{ steps.me.outputs.user }}
          mkdir -p kr && cp neural/farm.py kr/
          cat > kr/kernel-metadata.json <<META
          {"id":"$U/kodfilm-farm-run${{ github.event.inputs.hero && '-' || '' }}${{ github.event.inputs.hero }}${{ github.event.inputs.part && '-p' || '' }}${{ github.event.inputs.part }}","title":"kodfilm-farm-run${{ github.event.inputs.hero && '-' || '' }}${{ github.event.inputs.hero }}${{ github.event.inputs.part && '-p' || '' }}${{ github.event.inputs.part }}","code_file":"farm.py","language":"python","kernel_type":"script",
           "is_private":true,"enable_gpu":true,"enable_internet":true,"machine_shape":"NvidiaTeslaT4","dataset_sources":["$U/${{ steps.me.outputs.ds }}"]}
          META
          kaggle kernels push -p kr
      - name: Wait for render
        run: |
          U=${{ steps.me.outputs.user }}
          sleep 60
          for i in $(seq 1 330); do
            S=$(kaggle kernels status $U/kodfilm-farm-run${{ github.event.inputs.hero && '-' || '' }}${{ github.event.inputs.hero }}${{ github.event.inputs.part && '-p' || '' }}${{ github.event.inputs.part }} 2>&1); echo "$(date +%T) $S"
            echo "$S" | grep -qiE 'complete|error|cancel' && break; sleep 60
          done
          # Kaggle даёт ноутбуку до 12 ч, а задание GitHub живёт ≤ 6 ч: если рендер ещё идёт — честно падаем,
          # результат потом забирает collect.yml (иначе «зелёный» запуск без кадров выглядит как успех)
          echo "$S" | grep -qi 'complete' || { echo "::error::рендер на Kaggle ещё не закончен: забрать позже через collect.yml (kernel kodfilm-farm-run${{ github.event.inputs.hero && '-' || '' }}${{ github.event.inputs.hero }}${{ github.event.inputs.part && '-p' || '' }}${{ github.event.inputs.part }})"; exit 1; }
          mkdir -p result && kaggle kernels output $U/kodfilm-farm-run${{ github.event.inputs.hero && '-' || '' }}${{ github.event.inputs.hero }}${{ github.event.inputs.part && '-p' || '' }}${{ github.event.inputs.part }} -p result || true
          ls -laR result | head -30; tail -60 result/*.log 2>/dev/null || true
      - name: Save result to branch
        if: always()
        run: |
          cd result && rm -f *.log && git init -q && git checkout -q -b results-farm && git add -A && \
          git -c user.name=kodfilm-bot -c user.email=bot@kodfilm commit -qm "result" && \
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:refs/heads/results-farm${{ github.event.inputs.hero && '-' || '' }}${{ github.event.inputs.hero }}${{ github.event.inputs.part && '-p' || '' }}${{ github.event.inputs.part }} || echo "nothing to save"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: farm-render, path: result/, retention-days: 14 }
