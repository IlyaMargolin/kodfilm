name: Collect Kaggle output
on:
  workflow_dispatch:
    inputs:
      kernel: { description: 'Имя ноутбука без пользователя', default: 'kodfilm-hram-test-run' }
      branch: { description: 'Ветка для результата', default: 'results-neural' }
      account: { description: 'Аккаунт Kaggle: пусто = основной (KAGGLE_API_TOKEN), 2 = второй (KAGGLE_API_TOKEN_2)', default: '' }
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ github.event.inputs.account == '2' && secrets.KAGGLE_API_TOKEN_2 || secrets.KAGGLE_API_TOKEN }}
    steps:
      - run: pip install -q -U kaggle
      - run: |
          U=$(python3 -c "from kaggle.api.kaggle_api_extended import KaggleApi as K; a=K(); a.authenticate(); print(a.get_config_value('username'))")
          S=$(kaggle kernels status $U/${{ github.event.inputs.kernel }} 2>&1); echo "$S"
          echo "$S" | grep -qi 'complete' || { echo "::error::ноутбук ещё не закончил: вывод был бы от прошлой версии"; exit 1; }
          mkdir -p result && kaggle kernels output $U/${{ github.event.inputs.kernel }} -p result
          ls -la result result/out 2>/dev/null | head -20
          # ферма: ноутбук «закончил», но кадров нет — провал (лог в выводе выше), а не пустая «успешная» ветка
          if [ -f result/farm.py ] || ls result/out/log_*.txt >/dev/null 2>&1; then
            [ -f result/out/frames.mp4 ] || { grep -ohE 'ERROR[^"]*|Traceback[^"]*' result/out/*.txt 2>/dev/null | sort | uniq -c | head; echo "::error::Kaggle не выдал кадров"; exit 1; }
          fi
          cd result && rm -f *.log && git init -q && git checkout -q -b B && git add -A && \
          git -c user.name=kodfilm-bot -c user.email=bot@kodfilm commit -qm "result" && \
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git B:${{ github.event.inputs.branch }}
