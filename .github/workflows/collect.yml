name: Collect Kaggle output
on:
  workflow_dispatch:
    inputs:
      kernel: { description: 'Имя ноутбука без пользователя', default: 'kodfilm-farm-run-pilgrim' }
      branch: { description: 'Ветка для результата', default: 'results-farm-pilgrim' }
      account: { description: 'Номер аккаунта Kaggle, на котором считался ноутбук (1–8; farm.yml пишет его в итоге запуска). Пусто = 1', default: '' }
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      KT1: ${{ secrets.KAGGLE_API_TOKEN }}
      KT2: ${{ secrets.KAGGLE_API_TOKEN_2 }}
      KT3: ${{ secrets.KAGGLE_API_TOKEN_3 }}
      KT4: ${{ secrets.KAGGLE_API_TOKEN_4 }}
      KT5: ${{ secrets.KAGGLE_API_TOKEN_5 }}
      KT6: ${{ secrets.KAGGLE_API_TOKEN_6 }}
      KT7: ${{ secrets.KAGGLE_API_TOKEN_7 }}
      KT8: ${{ secrets.KAGGLE_API_TOKEN_8 }}
    steps:
      - run: pip install -q -U kaggle
      - run: |
          T=KT${{ github.event.inputs.account || '1' }}; export KAGGLE_API_TOKEN="${!T}"
          [ -n "$KAGGLE_API_TOKEN" ] || { echo "::error::нет секрета для аккаунта ${{ github.event.inputs.account }}"; exit 1; }
          U=$(python3 -c "from kaggle.api.kaggle_api_extended import KaggleApi as K; a=K(); a.authenticate(); print(a.get_config_value('username'))" 2>&1) || { echo "::error::токен аккаунта не принят: $U"; exit 1; }
          S=$(kaggle kernels status $U/${{ github.event.inputs.kernel }} 2>&1) || true; echo "$U: $S"
          echo "$S" | grep -qi 'complete' || { echo "::error::ноутбук ещё не закончил: вывод был бы от прошлой версии"; exit 1; }
          mkdir -p result && kaggle kernels output $U/${{ github.event.inputs.kernel }} -p result
          ls -la result result/out 2>/dev/null | head -20
          # ферма: ноутбук «закончил», но кадров нет — провал (лог в выводе выше), а не пустая «успешная» ветка
          if [ -f result/farm.py ] || ls result/out/log_*.txt >/dev/null 2>&1; then
            ls result/out/*.mp4 >/dev/null 2>&1 || { grep -ohE 'ERROR[^"]*|Traceback[^"]*' result/out/*.txt 2>/dev/null | sort | uniq -c | head; echo "::error::Kaggle не выдал кадров"; exit 1; }
          fi
          cd result && rm -f *.log && git init -q && git checkout -q -b B && git add -A && \
          git -c user.name=kodfilm-bot -c user.email=bot@kodfilm commit -qm "result" && \
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git B:${{ github.event.inputs.branch }}
